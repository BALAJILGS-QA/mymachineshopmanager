<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#8db600" />
    <title>Machine Shop Management — Job Orders, Invoices & Delivery Challans</title>
    <meta
      name="description"
      content="Machine Shop Management — track job orders, materials, delivery challans, invoices, payments and expenses for your machine shop, company-wise, from order to dispatch."
    />
    <link rel="canonical" href="https://sreebalajiindustries.netlify.app/" />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="Machine Shop Management" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Machine Shop Management" />
    <meta property="og:description" content="Track job orders, materials, delivery challans, invoices, payments and expenses — company-wise, from order to dispatch." />
    <meta property="og:url" content="https://sreebalajiindustries.netlify.app/" />
    <meta property="og:image" content="https://sreebalajiindustries.netlify.app/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Saira:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Belt-and-braces: hide any injected Netlify badge */
      a[href*="netlify.com"],
      [id*="netlify-badge"],
      [class*="netlify-badge"] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Remove any injected "Powered by Netlify" badge from the DOM.
      (function () {
        function nuke() {
          document.querySelectorAll('a').forEach(function (a) {
            var href = (a.getAttribute('href') || '').toLowerCase()
            if (href.indexOf('netlify.com') > -1 || /powered by netlify/i.test(a.textContent || '')) {
              ;(a.closest('[class*="badge"]') || a).remove()
            }
          })
          document
            .querySelectorAll('[id*="netlify-badge"],[class*="netlify-badge"]')
            .forEach(function (e) { e.remove() })
          // The badge is served inside an injected iframe. This app uses no
          // iframes, so remove src-less or netlify iframes and their wrappers.
          document.querySelectorAll('iframe').forEach(function (f) {
            var src = (f.getAttribute('src') || '').toLowerCase()
            var title = (f.getAttribute('title') || '').toLowerCase()
            if (!src || src.indexOf('netlify') > -1 || title.indexOf('netlify') > -1) {
              var host = f.closest('div')
              ;(host && host !== document.body ? host : f).remove()
            }
          })
        }
        nuke()
        var scheduled = false
        var mo = new MutationObserver(function () {
          if (scheduled) return
          scheduled = true
          requestAnimationFrame(function () { scheduled = false; nuke() })
        })
        document.addEventListener('DOMContentLoaded', function () {
          nuke()
          mo.observe(document.documentElement, { childList: true, subtree: true })
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
