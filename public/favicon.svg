<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MSM — Machine Shop Management">
  <defs>
    <linearGradient id="hx" x1="12" y1="3" x2="52" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="32" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Charcoal hexagon (outer rim) -->
  <path d="M32 2 58 17 58 47 32 62 6 47 6 17Z" fill="#18181B"/>
  <!-- Industrial-orange hexagon face -->
  <path d="M32 6.6 53.4 19.7 53.4 44.3 32 57.4 10.6 44.3 10.6 19.7Z" fill="url(#hx)"/>
  <path d="M32 6.6 53.4 19.7 53.4 44.3 32 57.4 10.6 44.3 10.6 19.7Z" fill="url(#sheen)"/>
  <!-- Thin white inner keyline for definition at small sizes -->
  <path d="M32 9.1 51.2 20.9 51.2 43.1 32 54.9 12.8 43.1 12.8 20.9Z" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.1"/>
  <!-- MSM wordmark -->
  <text x="32" y="36.6" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-weight="800" font-size="17" letter-spacing="-0.8" fill="#ffffff">MSM</text>
  <!-- Charcoal accent bar (brand continuity) -->
  <rect x="23" y="41.5" width="18" height="2.6" rx="1.3" fill="#18181B" fill-opacity="0.9"/>
</svg>
